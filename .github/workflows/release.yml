name: release

on:
  push:
    branches: [main]
    paths: ['VERSION']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "$v already released"
          else
            gh release create "$v" --generate-notes
          fi
