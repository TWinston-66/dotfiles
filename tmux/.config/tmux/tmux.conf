# Reload -> prefix + r

bind r source-file "~/.config/tmux/tmux.conf" \; display "reloaded"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:extkeys:hyperlinks:sync:clipboard"

set -s escape-time 10
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g allow-passthrough all
set -g focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
setw -g aggressive-resize on
set -g status-interval 5

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S: #{b:pane_current_path}"

set -g mouse on
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode DoubleClick1Pane send -X select-word \; send -X copy-selection-no-clear


bind -N "sesh" o display-popup -h 60% -w 60% -E "sesh picker -i"
set -g detach-on-destroy off 


set-environment -g TMUX_FZF_LAUNCH_KEY "f"
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 60% -m"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"


set -g @catppuccin_flavor 'mocha'

# Transparent status bar -> inherit the terminal background
set -g @catppuccin_status_background 'none'

set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_status_right_separator ' '

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g @catppuccin_uptime_text '#{l: #(~/.local/share/tmux/plugins/tmux-uptime/scripts/uptime.sh)}'
set -g @catppuccin_load_text '#{l: #(tmux-mem-cpu-load -i 5 -g 0)}'

set -g @catppuccin_status_session_bg_color "default"
set -g @catppuccin_status_uptime_bg_color "default"
set -g @catppuccin_status_load_bg_color "default"
set -g @catppuccin_status_date_time_bg_color "default"

run "$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux"

set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

set -g window-status-separator ' '

set -g status-left '#{E:@catppuccin_status_session}'

set -gF  status-right '#{@catppuccin_status_gitmux}'
set -agF status-right '#{E:@catppuccin_status_uptime}'
set -agF status-right '#{E:@catppuccin_status_load}'
set -ag  status-right '#{E:@catppuccin_status_date_time}'


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'robhurring/tmux-uptime'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Install -> prefix + I, update -> prefix + U, clean -> prefix + M-u
run "$HOME/.local/share/tmux/plugins/tpm/tpm"

set -gF  window-status-format "#[fg=#{@catppuccin_window_text_color},bg=default]"
set -agF window-status-format "#[fg=#{@thm_fg},bg=#{@catppuccin_window_text_color}]#{@catppuccin_window_text} "
set -agF window-status-format "#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}] #{@catppuccin_window_number}"
set -agF window-status-format "#[fg=#{@catppuccin_window_number_color},bg=default]#[none]"

set -gF  window-status-current-format "#[fg=#{@catppuccin_window_current_text_color},bg=default]"
set -agF window-status-current-format "#[fg=#{@thm_fg},bg=#{@catppuccin_window_current_text_color}]#{@catppuccin_window_current_text} "
set -agF window-status-current-format "#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}] #{@catppuccin_window_current_number}"
set -agF window-status-current-format "#[fg=#{@catppuccin_window_current_number_color},bg=default]#[none]"
