# Reload -> prefix + r

bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "reloaded"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

set -s escape-time 10
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g allow-passthrough all
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S: #{b:pane_current_path}"

# Splits inherit the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

set -g set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

bind -N "sesh" o display-popup -h 60% -w 60% -E "sesh picker -i"

set-environment -g TMUX_FZF_LAUNCH_KEY "f"
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 60% -m"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @continuum-restore 'on'

# Install -> prefix + I, update -> prefix + U, clean -> prefix + M-u
run "$HOME/.local/share/tmux/plugins/tpm/tpm"
